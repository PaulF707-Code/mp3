<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMMP3</title>
<style>

:root {
  --bg:            #EEF2F6;
  --surface:       #0000000D;
  --surface-solid: #FFFFFF;
  --line:          #CFD8E3;

  --text:          #17202E;
  --muted:         #5B6B80;

  --accent:        #2563EB;
  --accent-hover:  #1D4ED8;
  --accent-active: #1E40AF;
  --accent-tint:   #BFDBFE;
  --accent-ink:    #FFFFFF;

  --danger:        #C92A2A;

  --font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

:root[data-theme="dark"]{--bg:#0c0c0d;--surface:#ffffff14;--surface-solid:#1b1b1d;--line:#363639;--text:#f1f1f2;--muted:#9c9ca3;--accent:#ff7a3d;--accent-ink:#1a0800;--danger:#ff8d7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.02em}
.who{color:var(--muted);font-size:.85rem;margin-right:8px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 12px;font-size:.85rem}
main{max-width:1280px;margin:0 auto;padding:18px}
.hidden{display:none!important}
.hero{padding:48px 0 24px}
.hero h2{font-size:clamp(1.9rem,7vw,3rem);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);max-width:46ch;margin:0 0 22px}
.status{color:var(--muted);font-size:.9rem;min-height:1.4em;margin:6px 0 12px}
.status.err{color:var(--danger)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--text);text-decoration:underline;text-underline-offset:3px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list .row{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:12px 4px}
.list .row:hover{background:var(--surface)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
#search{flex:1 1 220px;min-width:0;max-width:380px;background:var(--surface-solid);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;font:inherit}
h3{font-size:1.05rem;margin:26px 0 8px;font-weight:600;color:var(--muted)}
details.album{border-bottom:1px solid var(--line)}
details.album summary{display:flex;align-items:center;gap:14px;padding:12px 4px;cursor:pointer;list-style:none}
details.album summary::-webkit-details-marker{display:none}
.cover{width:60px;height:60px;border-radius:6px;background:var(--surface-solid);border:1px solid var(--line);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.4rem}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{color:var(--muted);font-size:.85rem}
.tracks{padding:0 0 10px 74px}
.track{display:flex;width:100%;gap:10px;background:none;border:0;text-align:left;padding:7px 8px;border-radius:6px;align-items:baseline}
.track:hover{background:var(--surface)}
.track.playing{color:var(--accent)}
.track small{color:var(--muted);min-width:1.8em;text-align:right}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--surface-solid);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
#player .inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
#player .cover{width:52px;height:52px;grid-row:span 2}
#nowTitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowSub{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:4px;align-items:center;grid-row:span 2}
.ico{background:none;border:0;width:40px;height:40px;border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.ico:hover{background:var(--surface)}
.ico.on{color:var(--accent)}
.ico.main{background:var(--accent);color:var(--accent-ink);width:46px;height:46px}
.seek{grid-column:1/-1;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.78rem}
.seek input{flex:1;accent-color:var(--accent)}

.sel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
select,.field{background:var(--surface-solid);color:var(--text);border:1px solid var(--line);padding:7px 12px;font:inherit;border-radius:999px}
.field{border-radius:10px;width:100%;margin:4px 0 8px}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none}
.list li.prow{display:flex;align-items:center;gap:8px;padding-right:4px}
.list li.prow .row{flex:1;min-width:0}
.trk{display:flex;align-items:center}
.trk .track{flex:1;min-width:0}
.track span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track em{color:var(--muted);font-style:normal;margin-left:8px;font-size:.85em}
.mini{background:none;border:0;border-radius:50%;width:34px;height:34px;color:var(--muted);flex:none}
.mini:hover{background:var(--surface);color:var(--text)}
dialog{color:var(--text);background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;width:calc(100% - 28px);max-width:560px;max-height:88vh;overflow:auto;padding:18px}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 6px;font-size:1.25rem}
.muted{color:var(--muted);font-size:.9rem}
.diag{white-space:pre-wrap;word-break:break-word;font-size:.78rem;line-height:1.35;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:46vh;overflow:auto;user-select:text}
.sgroup{border-top:1px solid var(--line);padding:10px 0 6px}
.sgroup h3{margin:0 0 6px;font-size:1rem;color:var(--text)}
.sgroup p{margin:4px 0}
header .ico{font-size:1.35rem;width:44px;height:44px}
.dlist{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px;margin:8px 0}
.dlist:empty{display:none}
.dlist .btn{display:block;width:100%;text-align:left;margin:4px 0;border-radius:8px}
.drow{display:flex;align-items:center;gap:6px;padding:3px 6px}
.drow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow em{color:var(--muted);font-style:normal;font-size:.85em;margin-left:6px}
.dbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.flabel{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.opt small{color:var(--muted)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.panes{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.pane{min-width:0;min-height:320px;max-height:calc(100dvh - 250px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px 10px}
.pane > .bar,.pane > .seggroup{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 0 8px;margin:0}
.seggroup,.stabs,.mtabs{display:flex;gap:8px}
.stabs{margin:10px 0}
.mtabs{display:none;margin:0 0 12px}
.seg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blist{min-height:140px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.blist .hint{padding:28px 14px;text-align:center}
.brow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:grab}
.brow .bn{color:var(--muted);min-width:2.2em;text-align:right;font-size:.85rem}
.brow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow em{color:var(--muted);font-style:normal;font-size:.85em;margin-left:6px}
.brow.dropbefore{box-shadow:0 -2px 0 var(--accent)}
.brow.dropafter{box-shadow:0 2px 0 var(--accent)}
.blist.dropend{box-shadow:inset 0 -2px 0 var(--accent)}
.trk[draggable=true],summary[draggable=true]{cursor:grab}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
.erow{padding:6px 8px;border-bottom:1px solid var(--line);font-size:.85rem}
.erow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hstatus{flex:2 1 0;min-width:0;line-height:1.2}
#hstatus .status{font-size:.72rem;min-height:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:899px){ #hstatus{display:none!important} #search{max-width:560px} }
@media (max-width:819px){
  .panes{display:block}
  .pane{max-height:none;overflow:visible;border:0;padding:0}
  .pane > .bar,.pane > .seggroup{position:static}
  .mtabs{display:flex}
  .panes[data-pane="left"] #rightPane,.panes[data-pane="right"] #leftPane{display:none}
}
@media (max-width:560px){
  #player .inner{grid-template-columns:auto 1fr}
  .ctl{grid-column:1/-1;grid-row:auto;justify-content:center}
  #player .cover{grid-row:auto}
  .tracks{padding-left:8px}
  .who{display:none}
  body{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){ .btn{transition:border-color .15s} }
</style>
</head>
<body>
<header>
  <h1>PMMP3</h1>
  <input type="search" id="search" class="hidden" placeholder="Search tracks, artists, albums" aria-label="Search">
  <div id="hstatus" class="hidden"><div class="status" id="libStatus"></div><div class="status" id="tagStatus"></div></div>
  <button class="ico" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
</header>

<main>
  <!-- Signed out -->
  <section id="vSignedOut" class="hero hidden">
    <h2>Perpetual Motion Music Player</h2>
    <p>Your OneDrive music, played properly. Sign in with your Microsoft account, pick a folder, and play every MP3 and playlist inside it. Your files stay in OneDrive.</p>
    <button class="btn primary" id="signIn">Sign in with Microsoft</button>
    <div class="status err" id="cfgWarn"></div>
  </section>

  <!-- Folder picker -->
  <section id="vPicker" class="hidden">
    <h2 style="margin:6px 0 4px">Choose your music folder</h2>
    <div class="crumbs" id="crumbs"></div>
    <div class="bar"><button class="btn primary" id="useFolder">Use this folder</button></div>
    <div class="status" id="pickStatus"></div>
    <ul class="list" id="folderList"></ul>
  </section>

  <!-- Library -->
  <section id="vLibrary" class="hidden">
    <div class="mtabs"><button class="seg on" id="mtabLib" data-m="left">Library</button><button class="seg" id="mtabLists" data-m="right">Lists</button></div>
    <div class="panes" id="panes" data-pane="left">
      <div class="pane" id="leftPane">
        <div class="bar">
          <label class="sel">View
            <select id="viewSel">
              <option value="folders">Folders</option><option value="artist">Artist</option><option value="album">Album</option>
              <option value="genre">Genre</option><option value="year">Year</option><option value="all">All tracks</option>
            </select></label>
          <label class="sel">Sort
            <select id="sortSel">
              <option value="default">Default</option><option value="title">Title</option><option value="artist">Artist</option>
              <option value="album">Album</option><option value="year">Year</option><option value="genre">Genre</option>
            </select></label>
        </div>
        <div id="libraryBody"></div>
      </div>
      <div class="pane" id="rightPane">
        <div class="seggroup"><button class="seg on" id="tabPl" data-ra="tabPl">Playlists</button><button class="seg" id="tabBuild" data-ra="tabBuild">Build list (0)</button></div>
        <div id="rightBody"></div>
      </div>
    </div>
  </section>
</main>

<dialog id="dlg"></dialog>

<div id="player" class="hidden">
  <div class="inner">
    <div class="cover" id="nowCover">♪</div>
    <div style="min-width:0"><div id="nowTitle">Nothing playing</div><div id="nowSub"></div></div>
    <div class="ctl">
      <button class="ico" id="bShuffle" title="Shuffle" aria-label="Shuffle">⤮</button>
      <button class="ico" id="bPrev" title="Previous" aria-label="Previous">⏮</button>
      <button class="ico main" id="bPlay" title="Play/pause" aria-label="Play or pause">▶</button>
      <button class="ico" id="bNext" title="Next" aria-label="Next">⏭</button>
      <button class="ico" id="bRepeat" title="Repeat: off" aria-label="Repeat">⟳</button>
    </div>
    <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<script src="config.js"></script>
<script>
/* Settings come from config.js (edit that file, not this one) */
const CONFIG = Object.assign({
  clientId: 'YOUR_CLIENT_ID_HERE',
  authority: 'https://login.microsoftonline.com/consumers',
  scopes: ['Files.ReadWrite', 'User.Read']
}, window.APP_CONFIG || {});

const GRAPH = 'https://graph.microsoft.com/v1.0';
const AUDIO_RE = /\.(mp3|m4a|aac|ogg|wav|flac)$/i;
const LIST_RE  = /\.(m3u8?|pls)$/i;
const IMG_RE   = /\.(jpe?g|png|gif|webp)$/i;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Every network call gets a timeout so one stuck request can never freeze a worker. The timer covers the wait for response headers only (not long downloads).
async function tfetch(url, opts, ms){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 25000);
  try { return await fetch(url, Object.assign({}, opts || {}, { signal: ctl.signal })); }
  catch(e){ if (ctl.signal.aborted) throw new Error('timed out'); throw e; }
  finally { clearTimeout(timer); }
}
const withTimeout = (p, ms) => new Promise((res, rej) => { const id = setTimeout(() => rej(new Error('timed out')), ms); p.then(v => { clearTimeout(id); res(v); }, e => { clearTimeout(id); rej(e); }); });
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const cmpS = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
const safe = s => String(s).replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').replace(/[. ]+$/, '').trim().slice(0, 120) || '_';
const tg = t => t.tags || {};
const tTitle = t => tg(t).t || t.title;
const tArtist = t => tg(t).a || '';
const setStatus = msg => { const a = document.getElementById('libStatus'), b = document.getElementById('setMsg'); if (a){ a.textContent = msg; a.title = msg; } if (b) b.textContent = msg; };
const TAG_KEYS = ['t','a','aa','al','g','y','n','d'];
const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';

/* ---------- Colour themes ---------- */
const THEMES = ['light', 'dark'];
function setTheme(t){
  if (!THEMES.includes(t)) t = 'light';
  document.documentElement.dataset.theme = t; store.set('theme', t);
}

/* ---------- Auth (OAuth 2.0 authorization code + PKCE, no library needed) ---------- */
const REDIRECT = location.origin + location.pathname;
const OAUTH = CONFIG.authority + '/oauth2/v2.0';
const SCOPE = CONFIG.scopes.concat('offline_access').join(' ');
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
let tok = store.get('tok');   // { access, refresh, exp, sv }
if (tok && tok.sv !== SCOPE) tok = null;   // permissions changed: require a fresh sign-in

async function tokenRequest(params){
  const res = await tfetch(OAUTH + '/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CONFIG.clientId, scope: SCOPE, ...params })
  }, 30000);
  const d = await res.json().catch(() => ({}));
  if (!res.ok || !d.access_token) throw new Error(d.error_description || d.error || ('token request failed (' + res.status + ')'));
  tok = { access: d.access_token, refresh: d.refresh_token || (tok && tok.refresh), exp: Date.now() + (d.expires_in || 3600) * 1000, sv: SCOPE };
  store.set('tok', tok);
}
async function initAuth(){
  if (CONFIG.clientId.startsWith('YOUR_')) {
    show('vSignedOut'); $('cfgWarn').textContent = 'Set your clientId in config.js before signing in.'; return;
  }
  const p = new URLSearchParams(location.search);
  if (p.get('error')){
    history.replaceState({}, '', REDIRECT);
    show('vSignedOut'); $('cfgWarn').textContent = 'Sign-in error: ' + (p.get('error_description') || p.get('error')); return;
  }
  if (p.get('code')){
    const verifier = sessionStorage.getItem('pkce_verifier'), state = sessionStorage.getItem('pkce_state');
    history.replaceState({}, '', REDIRECT);
    try {
      if (!verifier || p.get('state') !== state) throw new Error('sign-in session mismatch, please try again');
      await tokenRequest({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: REDIRECT, code_verifier: verifier });
    } catch(e){ show('vSignedOut'); $('cfgWarn').textContent = 'Sign-in failed: ' + e.message; return; }
  }
  if (tok) onSignedIn(); else show('vSignedOut');
}
async function signIn(){
  if (CONFIG.clientId.startsWith('YOUR_')){ $('cfgWarn').textContent = 'Sign-in is not set up: add your client ID in config.js.'; return; }
  try {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
    sessionStorage.setItem('pkce_verifier', verifier); sessionStorage.setItem('pkce_state', state);
    location.href = OAUTH + '/authorize?' + new URLSearchParams({
      client_id: CONFIG.clientId, response_type: 'code', redirect_uri: REDIRECT, response_mode: 'query',
      scope: SCOPE, state, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account'
    });
  } catch(e){ $('cfgWarn').textContent = 'Sign-in failed: ' + e.message; }
}
function signOut(clear = true){
  stopPlayback(); tok = null; store.set('tok', null); store.set('root', null); userName = '';
  if (clear) dbClearAll();
  lib = emptyLib(); resetTagQueue(); $('player').classList.add('hidden'); show('vSignedOut');
}
async function getToken(){
  if (tok && tok.exp > Date.now() + 60000) return tok.access;
  if (tok && tok.refresh){
    try { await tokenRequest({ grant_type: 'refresh_token', refresh_token: tok.refresh }); return tok.access; } catch(e){}
  }
  signOut(false); $('cfgWarn').textContent = 'Your session expired. Please sign in again.';
  throw new Error('session expired');
}
let userName = '';
function onSignedIn(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  gfetch('/me').then(d => { userName = d.userPrincipalName || d.displayName || ''; }).catch(() => {});
  const saved = store.get('root');
  if (saved) openLibrary(saved.id, saved.name, false); else openPicker();
}

/* ---------- Graph helpers ---------- */
const itemPath = id => id === 'root' ? '/me/drive/root' : `/me/drive/items/${encodeURIComponent(id)}`;
async function gfetch(pathOrUrl, tries = 4){
  const url = pathOrUrl.startsWith('http') ? pathOrUrl : GRAPH + pathOrUrl;
  for (let i = 0; i < tries; i++){
    let res;
    try { res = await tfetch(url, { headers: { Authorization: 'Bearer ' + await getToken() } }, 30000); }
    catch(e){ if (e.message === 'session expired' || i === tries - 1) throw e; await sleep(600 * 2 ** i); continue; }
    if (res.status === 429 || res.status === 503){
      onThrottle(); await sleep((parseInt(res.headers.get('Retry-After')) || 2 ** i) * 1000); continue;
    }
    if (!res.ok) throw new Error(`Graph ${res.status}`);
    return res.json();
  }
  throw new Error('Graph is busy, try again shortly');
}
// Write calls. If contentType is given, body is sent raw; otherwise it is JSON.
async function gsend(path, method, body, contentType){
  const headers = { Authorization: 'Bearer ' + await getToken() };
  if (body !== undefined) headers['Content-Type'] = contentType || 'application/json';
  const res = await tfetch(GRAPH + path, { method, headers, body: body === undefined ? undefined : (contentType ? body : JSON.stringify(body)) }, 60000);
  if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'no write permission (sign out and sign in again)' : 'OneDrive ' + res.status);
  return res.status === 204 ? null : res.json().catch(() => null);
}
async function listChildren(id, cb){

async function refreshUrl(item){

}
const stale = item => !item.url || Date.now() - (item.urlAt || 0) > 25 * 60 * 1000;
async function freshUrl(item){ if (stale(item)) await refreshUrl(item); return item.url; }
// Fetch download links for many files at once (20 per Graph $batch call)
async function prefetchUrls(list){
  const need = list.filter(stale), groups = [];
  for (let i = 0; i < need.length; i += 20) groups.push(need.slice(i, i + 20));
  await Promise.all(groups.map(async g => {
    try {
      const r = await tfetch(GRAPH + '/$batch', { method: 'POST',
        headers: { Authorization: 'Bearer ' + await getToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: g.map((t, i) => ({ id: String(i), method: 'GET', url: `${itemPath(t.id)}?$select=id,@microsoft.graph.downloadUrl` })) }) }, 30000);
      if (!r.ok) return;
      (await r.json()).responses.forEach(x => {
        const u = x.status === 200 && x.body && x.body['@microsoft.graph.downloadUrl'];
        if (u){ const t = g[+x.id]; t.url = u; t.urlAt = Date.now(); }

async function fetchFile(t){

}
async function fetchText(item){

}
// Upload a blob to an upload-session URL in chunks
async function putChunks(uploadUrl, blob){
  const size = blob.size, CH = 327680 * 10; let pos = 0, last = null;
  while (pos < size){
    const end = Math.min(pos + CH, size);
    let res;
    try { res = await tfetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${end - 1}/${size}` }, body: blob.slice(pos, end) }, 120000); }
    catch(e){ throw new Error('upload blocked by the browser'); }
    if (![200, 201, 202].includes(res.status)) throw new Error('upload failed (' + res.status + ')');
    last = res; pos = end;
  }
  return last && last.status !== 202 ? last.json().catch(() => null) : null;
}
// Replace the content of an existing OneDrive file (works for any size)
async function uploadReplace(item, blob){
  const sess = await gsend(`${itemPath(item.id)}/createUploadSession`, 'POST', { item: { '@microsoft.graph.conflictBehavior': 'replace' } });
  if (!sess || !sess.uploadUrl) throw new Error('could not start upload');
  return putChunks(sess.uploadUrl, blob);
}

// The library is a graph of nodes keyed by OneDrive item id. Folders: {id,pid,name,d:1}.
// Files: {id,pid,name,k:'t'|'p'|'i',sz,...}. Paths, folders and track lists are derived by rebuild().
const emptyLib = () => ({ nodes: new Map(), folders: new Map(), playlists: [], tracks: new Map(), byPath: new Map(), byName: new Map(), at: 0, rid: '', rootId: '', rootName: '', delta: '' });
let lib = emptyLib();

const build = { name: '', editing: null, items: [] };

const kindOf = name => AUDIO_RE.test(name) ? 't' : LIST_RE.test(name) ? 'p' : IMG_RE.test(name) ? 'i' : null;
// OneDrive extracts tags from audio files itself and exposes them as the "audio" facet.
function audioToTags(a){
  if (!a) return null;
  const o = {}, s = v => (v == null ? '' : String(v).trim());
  if (s(a.title)) o.t = s(a.title);
  if (s(a.artist)) o.a = s(a.artist);
  if (s(a.albumArtist)) o.aa = s(a.albumArtist);
  if (s(a.album)) o.al = s(a.album);
  if (s(a.genre)) o.g = genreName(s(a.genre));
  if (a.year > 0) o.y = String(a.year);
  if (a.track > 0) o.n = a.track;
  if (a.disc > 0) o.d = a.disc;
  return (o.t || o.a || o.al) ? o : null;
}
const MP3_RE = /\.mp3$/i;
const titleOf = (name, k) => k === 't' ? name.replace(/\.[^.]+$/, '').replace(/_/g, ' ') : name.replace(/\.[^.]+$/, '');
// New file: use OneDrive's own tag data when it has any, otherwise queue an MP3 for a header read.
function setInitialTags(n, audio){
  const ta = audioToTags(audio);
  if (ta){ n.tags = ta; n.tagState = 'complete'; }
  else { n.tags = {}; n.tagState = MP3_RE.test(n.name) ? 'pending' : 'empty'; }
}
// Changed file: forget old tags and re-read the file itself.
function resetTags(n){ n.tags = {}; n.tagState = MP3_RE.test(n.name) ? 'pending' : 'empty'; }
function makeFile(it, pid, seed){
  const k = kindOf(it.name); if (!k) return null;
  const n = { id: it.id, pid, name: it.name, k, sz: it.size || 0, modified: it.lastModifiedDateTime || '', url: '', urlAt: 0 };
  if (k === 't' || k === 'p') n.title = titleOf(it.name, k);
  if (k === 't'){
    // keep known tags unless the file changed (an empty stored size/time never counts as a change)
    const same = seed && (seed.tagState === 'complete' || seed.tagState === 'empty') &&
      (!seed.sz || !it.size || seed.sz === it.size) && (!seed.modified || !n.modified || seed.modified === n.modified);

}
function rebuild(){
  const nodes = lib.nodes, memo = new Map();

    const n = nodes.get(id); if (!n || n.pid == null) return null;
    const pp = pathOf(n.pid); if (pp === null) return null;
    const p = pp ? pp + '/' + n.name : n.name; memo.set(id, p); return p;
  };
  lib.folders = new Map(); lib.tracks = new Map(); lib.playlists = [];
  lib.folders.set('', { path: '', name: lib.rootName, tracks: [], images: [] });
  nodes.forEach(n => { if (!n.d) return; const p = pathOf(n.id); if (p) lib.folders.set(p, { path: p, name: n.name, tracks: [], images: [] }); });
  nodes.forEach(n => {
    if (n.d) return;

    const f = lib.folders.get(fp); if (!f) return;

    else f.images.push(n);
  });
  lib.folders.forEach(f => { f.tracks.sort((a, b) => cmpS(a.name, b.name)); f.images.sort((a, b) => cmpS(a.name, b.name)); });
  lib.playlists.sort((a, b) => cmpS(a.name, b.name));

}

  lib.byPath = new Map(); lib.byName = new Map();
  lib.tracks.forEach(t => {
    lib.byPath.set(t.path.toLowerCase(), t);
    const k = t.name.toLowerCase(); (lib.byName.get(k) || lib.byName.set(k, []).get(k)).push(t);

/* ---------- Full scan ---------- */
async function deltaBaseline(rid){
  // Ask OneDrive for a "from now" change token so later updates only fetch what changed.
  for (const base of [`/me/drive/items/${encodeURIComponent(rid)}/delta`, '/me/drive/root/delta']){
    try {
      let d = await gfetch(base + '?token=latest'), guard = 0;
      while (!d['@odata.deltaLink'] && d['@odata.nextLink'] && guard++ < 50) d = await gfetch(d['@odata.nextLink']);
      if (d['@odata.deltaLink']) return d['@odata.deltaLink'];
    } catch(e){}
  }
  return '';
}
async function scan(rootId, rootName, seed){
  show('vLibrary'); $('libraryBody').innerHTML = '';
  const oldTags = seed || new Map();
  if (!seed) lib.tracks.forEach(t => { oldTags.set(t.id, { tags: t.tags, tagState: t.tagState, sz: t.sz, modified: t.modified }); });
  setStatus('Preparing scan…');
  let rid;
  try { rid = (await gfetch(`${itemPath(rootId)}?$select=id`)).id; }
  catch(e){ setStatus('Could not open the folder: ' + e.message); return; }
  const delta = await deltaBaseline(rid);
  const nodes = new Map([[rid, { id: rid, pid: null, name: rootName, d: 1 }]]);
  const queue = [rid]; let rootFailed = false, active = 0, foldersDone = 0, files = 0;
  const setMsg = () => setStatus(`Scanning ${rootName}… ${foldersDone} folders, ${files} tracks`);
  setMsg();
  const worker = async () => {
    while (true){
      const fid = queue.shift();
      if (fid === undefined){ if (!active) return; await sleep(40); continue; }
      active++;
      try {
        await listChildren(fid, it => {
          if (it.folder){ nodes.set(it.id, { id: it.id, pid: fid, name: it.name, d: 1 }); queue.push(it.id); return; }
          if (!it.file) return;
          const n = makeFile(it, fid, oldTags.get(it.id));
          if (n){ nodes.set(n.id, n); if (n.k === 't') files++; }
        });
      } catch(e){ if (fid === rid) rootFailed = true; else setStatus('Some folders could not be read: ' + e.message); }
      finally { active--; foldersDone++; setMsg(); }
    }
  };
  await Promise.all(Array.from({ length: 10 }, worker));
  if (rootFailed && nodes.size === 1){ openPicker(); return; }
  lib = Object.assign(emptyLib(), { nodes, at: Date.now(), rid, rootId, rootName, delta });
  resetTagQueue();
  rebuild(); renderLibrary();
  enqueueTagScan(pendingTracks());          // tags fill in behind the scenes; the library is usable now
  setStatus(libSummary() + ' · saving…');
  const local = await dbReplaceAll();
  setStatus(libSummary() + (local ? ' · saved on this device' : '') + ' · backing up to OneDrive…');
  if (await runSnapshotNow()) setStatus(libSummary() + (local ? ' · saved on this device' : '') + ' · backed up to OneDrive' + (delta ? '' : ' (quick update not available)'));
}

/* ---------- Quick update (changes only, via OneDrive delta) ---------- */
function applyChanges(raw){
  const st = { added: 0, removed: 0, changed: 0, newTracks: [] };
  const last = new Map(); raw.forEach(it => last.set(it.id, it));
  const items = [...last.values()];
  items.forEach(it => { if (it.deleted && lib.nodes.delete(it.id)) st.removed++; });
  const upsert = (it, pid) => {
    const ex = lib.nodes.get(it.id);
    if (it.folder){
      if (ex && ex.d){ if (ex.name !== it.name || ex.pid !== pid) st.changed++; ex.name = it.name; ex.pid = pid; }
      else lib.nodes.set(it.id, { id: it.id, pid, name: it.name, d: 1 });
      return;
    }
    if (!it.file) return;
    const k = kindOf(it.name);
    if (!k){ if (ex && lib.nodes.delete(it.id)) st.removed++; return; }
    if (ex && !ex.d && ex.k === k){
      const moved = ex.name !== it.name || ex.pid !== pid, mod = it.lastModifiedDateTime || '';
      if (moved){ st.changed++; ex.name = it.name; ex.pid = pid; if (k !== 'i') ex.title = titleOf(it.name, k); }   // a rename never re-reads tags
      if (k === 't'){
        const sizeDiff = !!(it.size && ex.sz && it.size !== ex.sz);
        // OneDrive can bump the modified time on a rename or move, so a time change only counts when the item was not renamed/moved
        const timeDiff = !moved && !!(mod && ex.modified && mod !== ex.modified);
        if (sizeDiff || timeDiff){
          if (!moved) st.changed++;
          ex.sz = it.size || ex.sz; ex.url = ''; ex.urlAt = 0;
          resetTags(ex);
          if (ex.tagState === 'pending') st.newTracks.push(ex);
        } else if (it.size) ex.sz = it.size;
        if (mod) ex.modified = mod;
      } else if (it.size) ex.sz = it.size;
      return;
    }
    const n = makeFile(it, pid); lib.nodes.set(n.id, n); st.added++;
    if (n.k === 't' && n.tagState === 'pending') st.newTracks.push(n);
  };
  let pending = items.filter(it => !it.deleted && it.id !== lib.rid && it.parentReference && it.parentReference.id);
  let progress = true;
  while (pending.length && progress){
    progress = false; const rest = [];
    pending.forEach(it => { const pid = it.parentReference.id; if (lib.nodes.has(pid)){ upsert(it, pid); progress = true; } else rest.push(it); });
    pending = rest;
  }
  pending.forEach(it => { if (lib.nodes.delete(it.id)) st.removed++; });   // moved out of our folder
  // drop anything no longer reachable from the root (e.g. children of deleted folders)
  const ok = new Map();
  const reach = id => {
    if (id === lib.rid) return true;
    if (ok.has(id)) return ok.get(id);
    ok.set(id, false);
    const n = lib.nodes.get(id), r = !!n && n.pid != null && reach(n.pid);
    ok.set(id, r); return r;
  };
  [...lib.nodes.keys()].forEach(id => { if (!reach(id)){ lib.nodes.delete(id); st.removed++; } });
  return st;
}
let busy = false;
async function quickUpdate(){
  if (busy) return;
  if (!lib.delta){ setStatus('Quick update needs one full rescan first.'); return; }
  busy = true;
  try {
    setStatus('Checking OneDrive for changes…');
    let url = lib.delta, next = '', guard = 0; const items = [];
    while (url && guard++ < 1000){
      const d = await gfetch(url);
      items.push(...d.value); next = d['@odata.deltaLink'] || next; url = d['@odata.nextLink'] || null;
    }
    if (!next) throw new Error('no change token returned');
    const before = new Set(lib.tracks.keys());
    const st = applyChanges(items);
    lib.delta = next; metaDirty = true; scheduleFlush();
    if (st.added || st.removed || st.changed){
      lib.at = Date.now(); rebuild();
      purgeTracks([...before].filter(id => !lib.tracks.has(id)));
      renderLibrary();
      enqueueTagScan(st.newTracks);
      await dbReplaceAll(); requestSnapshot();
    }
    setStatus(`Up to date: ${st.added} added, ${st.removed} removed, ${st.changed} changed · ${libSummary()}`);
  } catch(e){
    busy = false;
    if (/Graph (400|404|410)|no change token/.test(e.message)){   // the change token is no longer valid: only then is a full rescan needed
      setStatus('The change token expired. Running a full rescan…');
      const r = store.get('root'); if (r) await openLibrary(r.id, r.name, true);
    } else setStatus('Could not check for changes (' + e.message + '). Your library is unchanged; it will retry next time.');
  } finally { busy = false; }
}

/* ---------- Saved library index (stored in the chosen OneDrive folder) ---------- */
const INDEX_NAME = 'mp3player-library.json';
const libSummary = () => `${lib.tracks.size} tracks · ${lib.playlists.length} playlists`;
async function openLibrary(id, name, force){
  show('vLibrary'); $('libraryBody').innerHTML = '';
  if (!force){
    setStatus('Loading library…');
    const local = await dbLoad(id);                       // 1. this device: instant, no network
    if (local && local.recs.some(r => r.id === local.meta.rid)){
      hydrateLocal(local.meta, local.recs, name); renderLibrary();
      setStatus(libSummary() + ' · loaded from this device');
      return afterLoad();
    }
    let data = null, err = null;                          // 2. OneDrive backup snapshot (first run on this device)
    for (let i = 0; i < 3; i++){
      try { data = await loadIndex(id); err = null; break; }
      catch(e){ err = e; await sleep(1500 * (i + 1)); }
    }
    if (err && !/unreadable/.test(err.message)){ showLoadError(err); return; }   // a failed read is not "no index": never rescan because of it
    if (data && (data.v === 3 || data.v === 4)){
      hydrate(data, name); renderLibrary();
      setStatus(libSummary() + ' · restored from the OneDrive backup (' + new Date(data.at).toLocaleString() + ')');
      dbReplaceAll();                                     // copy it onto this device
      if (data.v === 3) requestSnapshot();                // migrate the backup to v4 in due course
      return afterLoad();
    }
    if (data){   // v1/v2 index: rescan once, keeping the tags already read
      const seed = new Map();
      data.f.forEach(([path, tracks]) => tracks.forEach(r => {
        if (Array.isArray(r[2])){ const tg2 = {}; TAG_KEYS.forEach((k, i) => { if (r[2][i]) tg2[k] = r[2][i]; }); seed.set(r[0], { tags: tg2, tagState: Object.keys(tg2).length ? 'complete' : 'empty', sz: 0, modified: '' }); }
      }));

    }

  return scan(id, name);                                  // 3. nothing saved anywhere: scan
}
function afterLoad(){
  enqueueTagScan(pendingTracks());                        // resumes any enrichment that was interrupted last time
  if (lib.delta) quickUpdate();                           // always check for changes on open
}
function showLoadError(err){
  setStatus('Could not load the saved library: ' + err.message);
  $('libraryBody').innerHTML = `<p class="status err">Could not load the saved library (${esc(err.message)}). Nothing was changed.</p><div class="dbtns"><button class="btn primary" data-act="retryLoad">Retry</button><button class="btn" data-act="fullScan">Scan folder instead</button></div>`;
}
// OneDrive copy of the index. Returns null ONLY when there is genuinely no usable index; transient failures throw so the caller can retry.
async function loadIndex(rootId){
  let meta;
  try { meta = await gfetch(`${itemPath(rootId)}:/${INDEX_NAME}`); }
  catch(e){ if (/Graph 404/.test(e.message)) return null; throw e; }
  let res;
  try { res = await tfetch(meta['@microsoft.graph.downloadUrl'], {}, 30000); if (!res.ok) throw 0; }
  catch(_){
    res = await tfetch(`${GRAPH}${itemPath(rootId)}:/${INDEX_NAME}:/content`, { headers: { Authorization: 'Bearer ' + await getToken() } }, 60000);
    if (!res.ok) throw new Error('index download failed (' + res.status + ')');
  }
  let d; try { d = await res.json(); } catch(e){ throw new Error('index unreadable'); }

/* ---------- Local database (IndexedDB): the primary store ---------- */
// One record per node, so a finished tag read is a tiny write instead of re-saving the whole library.
// OneDrive only holds a backup snapshot. If IndexedDB is unavailable everything falls back to that snapshot.
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txP = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted')); });
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      if (!window.indexedDB) return res(null);
      const rq = indexedDB.open('pmmp3', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        d.createObjectStore('meta', { keyPath: 'rootId' });
        d.createObjectStore('nodes', { keyPath: 'key' }).createIndex('byRoot', 'rootId');
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = rq.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
  return dbp;
}
const keyRange = rootId => IDBKeyRange.bound(rootId + '|', rootId + '|\uffff');
function dbRec(n){
  const r = { key: lib.rootId + '|' + n.id, rootId: lib.rootId, id: n.id, pid: n.pid, name: n.name };
  if (n.d){ r.d = 1; return r; }
  r.k = n.k; r.sz = n.sz || 0;
  if (n.k === 't'){
    r.modified = n.modified || ''; r.tags = n.tags || {};
    r.tagState = (!n.tagState || n.tagState === 'reading') ? 'pending' : n.tagState;
    if (n.tagError) r.tagError = n.tagError;
  }
  return r;
}
const dbMeta = () => ({ rootId: lib.rootId, v: 5, rid: lib.rid, rootName: lib.rootName, at: lib.at, delta: lib.delta || '' });
async function dbLoad(rootId){
  try {

// After a pause the queue retries by itself in a minute (up to 5 times in a row without any success), so a bad patch of network never needs a button press.
function scheduleAutoResume(){

}
function retryFailedTags(auto){

  need.forEach(t => { t.tagState = 'pending'; t.queued = true; });
  const ids = new Set(need.map(t => t.id));

  while (!job.cancel){
    const left = need.filter(t => t.tagState === 'pending' || t.tagState === 'reading').length;

  if (queue.length){
    const cur = queue[qi];

const n0 = x => x.toLocaleString();

    (c.top ? `\nMost common error: ${c.top[0]} (×${c.top[1]})` : '') + (tagPaused ? '\nPaused after repeated failures.' : '');

/* ---------- Grouping / sorting / rendering ---------- */
const VIEW_TITLES = { folders: 'Folders', artist: 'Artists', album: 'Albums', genre: 'Genres', year: 'Years', all: 'All tracks' };
function trackCmp(sortBy, view){
  const alb = (x, y) => { const a = tg(x), b = tg(y); return cmpS(a.al || '~', b.al || '~') || ((a.d||0) - (b.d||0)) || ((a.n||0) - (b.n||0)) || cmpS(tTitle(x), tTitle(y)); };
  return (x, y) => {
    const a = tg(x), b = tg(y);
    switch (sortBy){
      case 'title':  return cmpS(tTitle(x), tTitle(y));
      case 'artist': return cmpS(a.a || '~', b.a || '~') || alb(x, y);
      case 'album':  return alb(x, y);
      case 'year':   return cmpS(a.y || '~', b.y || '~') || alb(x, y);
      case 'genre':  return cmpS(a.g || '~', b.g || '~') || alb(x, y);
      default:       return view === 'folders' ? cmpS(x.name, y.name) : alb(x, y);
    }
  };
}
function coverOf(folder){
  const imgs = folder.images;
  return imgs.find(i => /^(cover|folder|front|album)/i.test(i.name)) || imgs[0] || null;
}
function buildGroups(q){
  const view = $('viewSel').value, sortBy = $('sortSel').value;
  let groups = [];
  if (view === 'folders'){
    groups = [...lib.folders.values()].filter(f => f.tracks.length).map(f => ({
      key: f.path, name: f.name, sub: f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '', tracks: f.tracks.slice(), cover: coverOf(f) }));
    groups.sort((a, b) => cmpS(a.key, b.key));
  } else if (view === 'all'){
    groups = [{ key: 'all', name: 'All tracks', sub: '', tracks: [...lib.tracks.values()], cover: null }];
  } else {
    const m = new Map();
    lib.tracks.forEach(t => {
      const g = tg(t);
      const key = view === 'artist' ? (g.aa || g.a || 'Unknown artist')
                : view === 'album'  ? (g.al || 'Unknown album')
                : view === 'genre'  ? (g.g || 'Unknown genre')
                : (g.y || 'Unknown year');
      if (!m.has(key)) m.set(key, { key, name: key, sub: '', tracks: [], cover: null });
      m.get(key).tracks.push(t);
    });
    groups = [...m.values()];
    groups.forEach(g => {
      for (const t of g.tracks.slice(0, 12)){ const f = lib.folders.get(t.folder); const c = f && coverOf(f); if (c){ g.cover = c; break; } }
      if (view === 'album'){ const a = tg(g.tracks[0]); g.sub = a.aa || a.a || ''; }
    });
    groups.sort((a, b) => /^Unknown/.test(a.name) - /^Unknown/.test(b.name) || cmpS(a.name, b.name));
  }
  const cmp = trackCmp(sortBy, view);
  groups.forEach(g => g.tracks.sort(cmp));
  if (q){
    groups = groups.map(g => {
      const gm = g.name.toLowerCase().includes(q) || g.sub.toLowerCase().includes(q);
      const tr = gm ? g.tracks : g.tracks.filter(t => { const a = tg(t); return [tTitle(t), a.a, a.aa, a.al, a.g, a.y, t.name].some(x => x && String(x).toLowerCase().includes(q)); });
      return { ...g, tracks: tr };
    }).filter(g => g.tracks.length);
  }
  return groups;
}
function imgTag(item, cls, id){

  return `<img class="${cls}" alt="" draggable="false" ${id?`id="${id}"`:''} ${item.url ? `src="${esc(item.url)}"` : ''} data-img="${esc(item.id)}">`;
}
document.addEventListener('error', async e => {           // refresh expired image links once

/* ---------- Playlists (.m3u / .m3u8 / .pls) ---------- */
async function playlistTracks(p){

function resolveEntries(text, p){

    let t = null;
    if (!/^([a-z]:)?\//i.test(s)){
      const parts = p.folder ? p.folder.split('/') : [];
      for (const seg of s.split('/')){ if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
      t = lib.byPath.get(parts.join('/').toLowerCase());

}

/* ---------- Download to a local folder (or ZIP) ---------- */
const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
class Zip {
  constructor(){ this.parts = []; this.entries = []; this.offset = 0; const d = new Date(); this.time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1); this.date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(); }
  async add(name, blob){
    const nameB = new TextEncoder().encode(name), data = new Uint8Array(await blob.arrayBuffer()), crc = crc32(data);
    if (this.offset + data.length > 0xF0000000) throw new Error('ZIP would exceed 4 GB; download fewer items at once');
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, this.time, true); h.setUint16(12, this.date, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nameB.length, true); h.setUint16(28, 0, true);
    this.parts.push(h.buffer, nameB, blob);
    this.entries.push({ nameB, crc, size: data.length, offset: this.offset });
    this.offset += 30 + nameB.length + data.length;
  }
  finish(){
    const cdStart = this.offset; let cdSize = 0;
    for (const e of this.entries){
      const h = new DataView(new ArrayBuffer(46));
      h.setUint32(0, 0x02014b50, true); h.setUint16(4, 20, true); h.setUint16(6, 20, true); h.setUint16(8, 0x0800, true); h.setUint16(10, 0, true);
      h.setUint16(12, this.time, true); h.setUint16(14, this.date, true); h.setUint32(16, e.crc, true);
      h.setUint32(20, e.size, true); h.setUint32(24, e.size, true); h.setUint16(28, e.nameB.length, true);
      h.setUint32(42, e.offset, true);
      this.parts.push(h.buffer, e.nameB); cdSize += 46 + e.nameB.length;
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, this.entries.length, true); end.setUint16(10, this.entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, cdStart, true);
    this.parts.push(end.buffer);
    return new Blob(this.parts, { type: 'application/zip' });
  }
}

async function runDownload(mode, dir, job){
  const prog = m => { $('dprog').innerHTML = m; };
  prog('Preparing…');
  const units = [{ name: build.name.trim() || 'Playlist', tracks: build.items.slice() }];
  const jobs = [];
  if (mode === 'artist'){
    const all = []; const seen0 = new Set();
    units.forEach(u => u.tracks.forEach(t => { if (!seen0.has(t.id)){ seen0.add(t.id); all.push(t); } }));
    await readTagsFirst(all, job, (d, n) => prog(`Reading tags ${d}/${n}…`));
    const seen = new Set();
    units.forEach(u => u.tracks.forEach(t => {
      if (seen.has(t.id)) return; seen.add(t.id);
      const g = tg(t);
      jobs.push({ t, path: [g.aa || g.a || 'Unknown artist', g.al || 'Unknown album', t.name] });
    }));
  } else {
    const used = new Set();
    units.forEach(u => {
      let fn = safe(u.name), n = 2; while (used.has(fn.toLowerCase())) fn = `${safe(u.name)} (${n++})`; used.add(fn.toLowerCase());
      const w = Math.max(2, String(u.tracks.length).length);
      u.tracks.forEach((t, i) => jobs.push({ t, path: [fn, String(i + 1).padStart(w, '0') + ' - ' + t.name] }));
    });
  }
  if (!jobs.length){ prog('Nothing to download.'); return; }
  const zip = dir ? null : new Zip(); const errs = []; let done = 0;
  for (const j of jobs){
    if (job.cancel) break;
    prog(`${done}/${jobs.length} · ${esc(j.path[j.path.length - 1])}`);
    try {
      const res = await fetchFile(j.t);
      if (dir){
        let d = dir; for (const seg of j.path.slice(0, -1)) d = await d.getDirectoryHandle(safe(seg), { create: true });
        const fh = await d.getFileHandle(safe(j.path[j.path.length - 1]), { create: true });
        const w = await fh.createWritable();
        try { await res.body.pipeTo(w); } catch(e){ try { await w.abort(); } catch(_){} throw e; }
      } else {
        await zip.add(j.path.map(safe).join('/'), await res.blob());
      }
    } catch(e){ errs.push(`${j.t.name}: ${e.message}`); }
    done++;
  }
  if (!dir && !job.cancel && done > errs.length){
    const url = URL.createObjectURL(zip.finish());
    const a = document.createElement('a'); a.href = url; a.download = 'PMMP3 download.zip'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  prog(`${job.cancel ? 'Cancelled' : 'Finished'}: ${done - errs.length} of ${jobs.length} files ${dir ? 'saved' : 'added to the ZIP'}.` + (errs.length ? '<br>' + errs.slice(0, 5).map(esc).join('<br>') + (errs.length > 5 ? `<br>…and ${errs.length - 5} more` : '') : ''));
}

const audio = $('audio');
let queue = [], qi = -1, shuffle = false, repeat = 0, queueName = '', retried = false;

function setQueue(tracks, startIndex, name){
  queue = tracks.slice(); queueName = name || ''; $('player').classList.remove('hidden');
  playAt(Math.max(0, startIndex));
}
async function playAt(i, resumeAt){
  if (i < 0 || i >= queue.length) return;
  qi = i; const t = queue[i];
  if (!resumeAt) retried = false;
  try { showNow(t); markPlaying(); } catch(e){}
  try { if (stale(t)) await refreshUrl(t); }
  catch(e){ flash('Could not get a link for this track: ' + e.message); return; }
  audio.src = t.url;
  if (resumeAt) audio.addEventListener('loadedmetadata', () => { audio.currentTime = resumeAt; }, { once: true });
  audio.play().catch(()=>{});
}
function next(auto){
  if (!queue.length) return;
  if (repeat === 2 && auto) return playAt(qi);
  if (shuffle && queue.length > 1){ let j; do { j = Math.floor(Math.random() * queue.length); } while (j === qi); return playAt(j); }
  if (qi + 1 < queue.length) return playAt(qi + 1);
  if (repeat === 1 || !auto) return playAt(0);
  audio.pause();
}
function prev(){ if (audio.currentTime > 3) audio.currentTime = 0; else playAt(qi > 0 ? qi - 1 : 0); }
function stopPlayback(){ audio.pause(); audio.removeAttribute('src'); queue = []; qi = -1; }

function showNow(t){
  const g = tg(t), fold = t.folder.split('/').pop() || '';
  $('nowTitle').textContent = tTitle(t);
  $('nowSub').textContent = [g.a, g.al || fold, queueName && queueName !== (g.al || fold) ? queueName : ''].filter(Boolean).join(' · ');
  const f = lib.folders.get(t.folder), c = f && coverOf(f);
  $('nowCover').outerHTML = imgTag(c, 'cover', 'nowCover');
  if (c && !c.url) refreshUrl(c).then(u => { const el = $('nowCover'); if (el && el.tagName === 'IMG') el.src = u; }).catch(() => {});
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: tTitle(t), artist: g.a || fold || 'PMMP3', album: g.al || queueName,
      artwork: c && c.url ? [{ src: c.url }] : [] });
  }
}
function markPlaying(){
  document.querySelectorAll('.track.playing').forEach(b => b.classList.remove('playing'));
  const t = queue[qi]; if (!t) return;
  document.querySelectorAll(`.track[data-id="${CSS.escape(t.id)}"]`).forEach(b => b.classList.add('playing'));
}
function syncToggles(){
  $('bShuffle').classList.toggle('on', shuffle);

$('bShuffle').onclick = () => { shuffle = !shuffle; syncToggles(); };

    h += `<div class="sgroup"><h3>Appearance</h3><div class="dbtns"><button class="btn small ${dark ? '' : 'primary'}" data-d="light">Light</button><button class="btn small ${dark ? 'primary' : ''}" data-d="dark">Dark</button></div></div>`;
  }
  h += '<div class="status" id="setMsg"></div><div class="dbtns"><button class="btn" data-d="close">Close</button></div>';
  openDlg(h, {
    tab: el => openSettings(el.dataset.t),
    signout: () => { dlg.close(); signOut(); },
    signin: () => signIn(),
    folder: () => { dlg.close(); openPicker(); },
    quick: () => quickUpdate(),
    full: () => { const rt = store.get('root'); if (rt) openLibrary(rt.id, rt.name, true); },
    retry: () => retryFailedTags(),
    plfolder: () => openPlFolderDialog(),
    plroot: () => { store.set('plFolder', null); openSettings('account'); },
    reveal: el => { const t = lib.tracks.get(el.dataset.id); if (t){ dlg.close(); revealFolder(t.folder); } },
    od: async el => {
      const t = lib.tracks.get(el.dataset.id); if (!t) return;
      const w = window.open('', '_blank');           // opened first so the browser doesn't treat it as a pop-up
      try {
        const d = await gfetch(`${itemPath(t.pid)}?$select=webUrl`);
        if (w && d.webUrl) w.location.href = d.webUrl; else if (w) w.close();
      } catch(e){ if (w) w.close(); const m = $('setMsg'); if (m) m.textContent = 'Could not open OneDrive: ' + e.message; }
    },
    light: () => { setTheme('light'); openSettings(); },
    dark: () => { setTheme('dark'); openSettings(); }
  });
  updateTagStatus(true);
  try { navigator.storage.estimate().then(e => { const el = $('setStore'); if (el) el.textContent = `Local storage in use: ${(e.usage / 1048576).toFixed(1)} MB.`; }).catch(() => {}); } catch(_){}
}

/* ---------- Boot ---------- */
$('signIn').addEventListener('click', signIn);
$('settingsBtn').addEventListener('click', openSettings);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDb(); });
addEventListener('pagehide', () => { flushDb(); });
syncToggles(); setPane('left'); renderRight();
setTheme(store.get('theme') || CONFIG.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
initAuth();
</script>
</body>
</html>
